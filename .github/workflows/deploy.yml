# =============================================
# GitHub に変更を送る（push する）たびに、
# サイトを自動で作って GitHub Pages に公開する設定です。
# =============================================
name: サイトを公開する

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: サイトを作る
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: ファイルを取り出す
        uses: actions/checkout@v4
      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 部品をインストール
        run: npm ci
      - name: サイトを作る（out フォルダ）
        run: npm run build
      - name: 公開用にまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: 公開する
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
